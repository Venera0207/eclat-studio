<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Админка — ÉCLAT STUDIO</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Segoe UI', sans-serif;
  background: #0a0a1a;
  color: #e0e0e0;
  min-height: 100vh;
}
.login-screen {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 100vh;
}
.login-box {
  background: #15152a;
  padding: 40px;
  border-radius: 20px;
  box-shadow: 0 0 40px rgba(138, 43, 226, 0.3);
  text-align: center;
}
.login-box h1 {
  color: #ff1493;
  margin-bottom: 20px;
  font-size: 28px;
}
.login-box input {
  width: 100%;
  padding: 15px;
  border: 2px solid #8a2be2;
  border-radius: 10px;
  background: #0a0a1a;
  color: #fff;
  font-size: 16px;
  margin-bottom: 20px;
}
.login-box button {
  width: 100%;
  padding: 15px;
  background: linear-gradient(135deg, #8a2be2, #ff1493);
  border: none;
  border-radius: 10px;
  color: #fff;
  font-size: 16px;
  cursor: pointer;
  font-weight: bold;
}
.login-box button:hover {
  opacity: 0.9;
}
.dashboard {
  display: none;
  padding: 20px;
  max-width: 1200px;
  margin: 0 auto;
}
.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 30px;
  padding-bottom: 20px;
  border-bottom: 2px solid #8a2be2;
}
.header h1 {
  color: #ff1493;
  font-size: 32px;
}
.header button {
  padding: 10px 20px;
  background: #ff1493;
  border: none;
  border-radius: 8px;
  color: #fff;
  cursor: pointer;
  font-weight: bold;
}
.stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 20px;
  margin-bottom: 30px;
}
.stat-card {
  background: #15152a;
  padding: 20px;
  border-radius: 15px;
  text-align: center;
  box-shadow: 0 0 20px rgba(138, 43, 226, 0.2);
}
.stat-card .number {
  font-size: 36px;
  font-weight: bold;
  color: #00bfff;
}
.stat-card .label {
  color: #888;
  margin-top: 5px;
}
.controls {
  display: flex;
  gap: 15px;
  margin-bottom: 30px;
  flex-wrap: wrap;
}
.controls input, .controls select {
  padding: 12px;
  border: 2px solid #8a2be2;
  border-radius: 8px;
  background: #0a0a1a;
  color: #fff;
  font-size: 14px;
}
.controls button {
  padding: 12px 24px;
  background: linear-gradient(135deg, #8a2be2, #ff1493);
  border: none;
  border-radius: 8px;
  color: #fff;
  cursor: pointer;
  font-weight: bold;
}
.calendar {
  background: #15152a;
  padding: 20px;
  border-radius: 15px;
  margin-bottom: 30px;
}
.calendar h2 {
  color: #00bfff;
  margin-bottom: 20px;
}
.day-grid {
  display: grid;
  gap: 10px;
}
.booking-card {
  background: #0a0a1a;
  padding: 15px;
  border-radius: 10px;
  border-left: 4px solid #8a2be2;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px;
}
.booking-card .info {
  flex: 1;
}
.booking-card .time {
  color: #00bfff;
  font-weight: bold;
  font-size: 18px;
}
.booking-card .details {
  color: #aaa;
  margin-top: 5px;
}
.booking-card .actions {
  display: flex;
  gap: 10px;
}
.booking-card .actions button {
  padding: 8px 16px;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  font-weight: bold;
}
.btn-cancel {
  background: #ff4444;
  color: #fff;
}
.empty {
  text-align: center;
  padding: 40px;
  color: #666;
}
.modal {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.8);
  align-items: center;
  justify-content: center;
  z-index: 1000;
}
.modal-content {
  background: #15152a;
  padding: 30px;
  border-radius: 15px;
  max-width: 500px;
  width: 90%;
}
.modal-content h3 {
  color: #ff1493;
  margin-bottom: 20px;
}
.modal-content input, .modal-content select {
  width: 100%;
  padding: 12px;
  border: 2px solid #8a2be2;
  border-radius: 8px;
  background: #0a0a1a;
  color: #fff;
  margin-bottom: 15px;
  font-size: 14px;
}
.modal-content button {
  width: 100%;
  padding: 12px;
  background: linear-gradient(135deg, #8a2be2, #ff1493);
  border: none;
  border-radius: 8px;
  color: #fff;
  cursor: pointer;
  font-weight: bold;
  margin-bottom: 10px;
}
.modal-content .close {
  background: #444;
}
</style>
</head>
<body>

<div class="login-screen" id="loginScreen">
  <div class="login-box">
    <h1>🔐 Админка ÉCLAT STUDIO</h1>
    <input type="password" id="tokenInput" placeholder="Введите ADMIN_TOKEN">
    <button onclick="login()">Войти</button>
  </div>
</div>

<div class="dashboard" id="dashboard">
  <div class="header">
    <h1>Админка ÉCLAT STUDIO</h1>
    <button onclick="logout()">Выйти</button>
  </div>

  <div class="stats">
    <div class="stat-card">
      <div class="number" id="statTotal">0</div>
      <div class="label">Всего записей</div>
    </div>
    <div class="stat-card">
      <div class="number" id="statToday">0</div>
      <div class="label">Сегодня</div>
    </div>
    <div class="stat-card">
      <div class="number" id="statCanceled">0</div>
      <div class="label">Отменено</div>
    </div>
  </div>

  <div class="controls">
    <input type="date" id="dateInput">
    <button onclick="loadDay()">Загрузить день</button>
    <button onclick="showBlockModal()">+ Блок времени</button>
  </div>

  <div class="calendar">
    <h2 id="calendarTitle">Записи на день</h2>
    <div class="day-grid" id="dayGrid">
      <div class="empty">Выберите дату и нажмите «Загрузить день»</div>
    </div>
  </div>
</div>

<div class="modal" id="blockModal">
  <div class="modal-content">
    <h3>Добавить блок времени</h3>
    <input type="date" id="blockDate">
    <input type="time" id="blockStart" placeholder="Начало">
    <input type="time" id="blockEnd" placeholder="Конец">
    <select id="blockMaster">
      <option value="Все">Все мастера</option>
      <option value="Алиса">Алиса</option>
      <option value="Диана">Диана</option>
    </select>
    <input type="text" id="blockReason" placeholder="Причина (обед, ремонт и т.д.)">
    <button onclick="addBlock()">Добавить блок</button>
    <button class="close" onclick="closeBlockModal()">Отмена</button>
  </div>
</div>

<script>
var PIPE_URL = 'https://script.google.com/macros/s/AKfycby5QU83WgqvnfSlclUlPVyXu9WLTAiYWflEfTrOjw3z1l-dWXKvCu-RzSDSm5oH9peO-w/exec';
var TOKEN = localStorage.getItem('adminToken') || '';

window.onload = function() {
  console.log('PIPE_URL:', PIPE_URL);
  if (TOKEN) {
    document.getElementById('tokenInput').value = TOKEN;
    login();
  }
  document.getElementById('dateInput').value = new Date().toISOString().split('T')[0];
};

function login() {
  TOKEN = document.getElementById('tokenInput').value.trim();
  if (!TOKEN) {
    alert('Введите токен');
    return;
  }
  localStorage.setItem('adminToken', TOKEN);
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('dashboard').style.display = 'block';
  loadStats();
}

function logout() {
  localStorage.removeItem('adminToken');
  location.reload();
}

function loadStats() {
  var url = PIPE_URL + '?action=getStats&token=' + TOKEN + '&cb=cb';
  var script = document.createElement('script');
  window.cb = function(data) {
    if (data.ok) {
      document.getElementById('statTotal').textContent = data.total;
      document.getElementById('statToday').textContent = data.today;
      document.getElementById('statCanceled').textContent = data.canceled;
    }
    delete window.cb;
    document.head.removeChild(script);
  };
  script.src = url;
  document.head.appendChild(script);
}

function loadDay() {
  var date = document.getElementById('dateInput').value;
  if (!date) {
    alert('Выберите дату');
    return;
  }
  var url = PIPE_URL + '?action=getDay&date=' + date + '&token=' + TOKEN + '&cb=cb';
  var script = document.createElement('script');
  window.cb = function(data) {
    if (data.ok) {
      renderDay(date, data.bookings, data.blocks);
    } else {
      alert('Ошибка: ' + data.error);
    }
    delete window.cb;
    document.head.removeChild(script);
  };
  script.src = url;
  document.head.appendChild(script);
}

function renderDay(date, bookings, blocks) {
  document.getElementById('calendarTitle').textContent = 'Записи на ' + date;
  var grid = document.getElementById('dayGrid');
  grid.innerHTML = '';
  
  if (bookings.length === 0 && blocks.length === 0) {
    grid.innerHTML = '<div class="empty">На этот день нет записей и блоков</div>';
    return;
  }
  
  blocks.forEach(function(b) {
    var card = document.createElement('div');
    card.className = 'booking-card';
    card.style.borderLeftColor = '#ffaa00';
    card.innerHTML = '<div class="info"><div class="time">' + b.start + ' – ' + b.end + '</div><div class="details">Блок: ' + b.master + ' — ' + b.reason + '</div></div>';
    grid.appendChild(card);
  });
  
  bookings.forEach(function(b) {
    var card = document.createElement('div');
    card.className = 'booking-card';
    card.innerHTML = '<div class="info"><div class="time">' + b.start + ' – ' + b.end + '</div><div class="details">' + b.master + ' · ' + b.service + '<br>' + b.name + ' · <a href="tel:' + b.phone + '">' + b.phone + '</a></div></div><div class="actions"><button class="btn-cancel" onclick="cancelBooking(\'' + b.id + '\')">Отменить</button></div>';
    grid.appendChild(card);
  });
}

function cancelBooking(id) {
  if (!confirm('Отменить запись ' + id + '?')) return;
  var url = PIPE_URL + '?action=cancel&id=' + id + '&token=' + TOKEN + '&cb=cb';
  var script = document.createElement('script');
  window.cb = function(data) {
    if (data.ok) {
      alert('Запись отменена');
      loadDay();
      loadStats();
    } else {
      alert('Ошибка: ' + data.error);
    }
    delete window.cb;
    document.head.removeChild(script);
  };
  script.src = url;
  document.head.appendChild(script);
}

function showBlockModal() {
  document.getElementById('blockDate').value = document.getElementById('dateInput').value;
  document.getElementById('blockModal').style.display = 'flex';
}

function closeBlockModal() {
  document.getElementById('blockModal').style.display = 'none';
}

function addBlock() {
  var date = document.getElementById('blockDate').value;
  var start = document.getElementById('blockStart').value;
  var end = document.getElementById('blockEnd').value;
  var master = document.getElementById('blockMaster').value;
  var reason = document.getElementById('blockReason').value;
  
  if (!date || !start || !end) {
    alert('Заполните дату и время');
    return;
  }
  
  var url = PIPE_URL + '?action=addBlock&date=' + date + '&start=' + start + '&end=' + end + '&master=' + master + '&reason=' + reason + '&token=' + TOKEN + '&cb=cb';
  var script = document.createElement('script');
  window.cb = function(data) {
    if (data.ok) {
      alert('Блок добавлен');
      closeBlockModal();
      loadDay();
    } else {
      alert('Ошибка: ' + data.error);
    }
    delete window.cb;
    document.head.removeChild(script);
  };
  script.src = url;
  document.head.appendChild(script);
}
</script>

</body>
</html>
